syntax = "proto3";

option go_package = "github.com/myrteametrics/myrtea-engine-api/plugins/baseline/proto";

package proto;

message MatrixProfileResultRequest {
    int64 situation_id = 1;
    int64 situation_instance_id = 2;
    string time = 3;
    // Expression facts evaluated for the current tick, keyed by name. A definition whose
    // value_type is "fact_expression" reads its current point from here instead of from
    // situation_history_v5, since that row is not written until after this call returns.
    map<string, double> expression_facts = 4;
}

message MatrixProfileResult {
    string status = 1;
    double matching_score = 2;
    double matching_score_theoretical = 3;
    string best_match_time = 4;
}

message MatrixProfileResults {
    map<string, MatrixProfileResult> values = 1;
}

service Baseline {
    rpc GetMatrixProfileResults(MatrixProfileResultRequest) returns (MatrixProfileResults) {}
}
